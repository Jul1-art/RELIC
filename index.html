<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="RELIC — Explore the solar system and the stories we left among the stars.">
  <title>RELIC — Explore our solar system</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('nasa-atlas-theme')==='day'?'day':'night'}catch{document.documentElement.dataset.theme='night'}</script>
  <link rel="stylesheet" href="./styles.css?v=7">
  <link rel="stylesheet" href="./live.css?v=1">
  <link rel="stylesheet" href="./premium.css?v=8">
  <link rel="stylesheet" href="./theme.css?v=1">
  <link rel="stylesheet" href="./compact.css?v=3">
  <link rel="stylesheet" href="./relic-shell.css?v=1">
  <link rel="stylesheet" href="./film-bridge.css?v=1">
  <link rel="stylesheet" href="./intro/prologue-v8.css?v=8.4-subtitles-1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script>
</head>
<body class="atlas-page" data-mode="overview">
  <div id="scene" aria-label="Interactive solar system"></div>
  <div id="planet-labels" aria-hidden="false"></div>

  <header class="topbar">
    <a class="identity" href="#" id="brand-home" aria-label="RELIC — return to the solar system">
      <svg class="relic-mark" viewBox="100 85 320 285" aria-hidden="true"><path d="M184 345V166h78c44 0 67 26 67 58 0 36-27 60-69 60h-76m71 0 79 66"/><path d="M126 301C83 197 172 99 280 112c53 7 93 31 116 73"/><circle cx="396" cy="185" r="10"/></svg>
      <span class="identity-copy"><strong>RELIC</strong><small>Beyond the journey</small></span>
    </a>
    <span class="topbar-hint">GLISSER POUR TOURNER <span>·</span> PINCER OU DÉFILER POUR ZOOMER</span>
    <div class="header-actions">
      <button class="header-language" data-language-toggle type="button" aria-label="Switch language">EN</button>
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch appearance"><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 13.1A8.8 8.8 0 0 1 10.9 3.3 8.9 8.9 0 1 0 20.7 13.1Z"/></svg></button>
      <button id="relic-settings" class="relic-icon-button" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main>
    <nav class="destinations glass" aria-label="Choose a world">
      <div id="planet-navigation" class="planet-navigation"></div>
    </nav>

    <aside class="details glass" id="details" aria-live="polite" hidden>
      <div class="detail-top"><span id="detail-category">EXPLORATION</span><button id="details-toggle" type="button" aria-label="Collapse details" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <div class="detail-identity"><span class="detail-orb" id="detail-orb"></span><div><h2 id="detail-name">Solar system</h2><p id="detail-subtitle">A neighbourhood to explore</p></div></div>
      <div class="detail-expanded">
        <div id="detail-actions" class="detail-actions"></div>
        <section id="live-data" class="live-data" aria-live="polite"></section>
      </div>
    </aside>
  </main>

  <div class="imagery-credit" id="imagery-credit" hidden></div>
  <div class="gesture-hint" id="gesture-hint" hidden>GLISSEZ POUR VOUS DÉPLACER <span>·</span> PINCEZ OU DÉFILEZ POUR ZOOMER</div>

  <footer class="toolbar glass" aria-label="Exploration controls">
    <div class="relic-secondary-actions">
      <button id="relic-replay" class="relic-icon-button" type="button" aria-label="Watch the film" title="Watch the film"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg></button>
      <button id="relic-credits" class="relic-icon-button" type="button" aria-label="Sources and creators" title="Sources and creators"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5m0-9v.1"/></svg></button>
    </div>
    <button class="tool-button info-button" id="info-toggle" type="button" aria-label="Show details" aria-expanded="false" hidden>Info</button>
    <button class="overview-button" id="overview-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-25 12 12)"/></svg><span>Solar system</span></button>
  </footer>

  <div class="loading" id="loading" role="status"><span class="loading-orbit"></span><span>Opening the solar system</span></div>
  <div class="error-screen" id="error-screen" role="alert" hidden><strong>The 3D view could not start.</strong><p id="error-message">Reload the page to try again.</p></div>
  <section id="intro" class="intro" aria-label="RELIC — the story of exploration"></section>
  <script type="module" src="./theme.js?v=2"></script>
  <script type="module" src="./film-bridge.js?v=1"></script>
  <script type="module" src="./app.js?v=16"></script>
</body>
</html>
